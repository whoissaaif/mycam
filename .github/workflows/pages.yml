# Publishes website/ to mycam.dev (GitHub Pages, custom domain set in the repo's Pages settings), with the
# version, download links and sizes filled in from the latest GitHub release (.github/scripts/fill-release.sh).
# release.yml runs this again whenever a release is published or changed, so the site follows each release
# by itself. (The Pages environment only deploys from main, so a release event can't deploy directly.)
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml", ".github/scripts/fill-release.sh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fill in the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fill-release.sh website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
