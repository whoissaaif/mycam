<style>
  /* A pixel phone and PC with the cable pulled out. Drawn as blocks on an
     8px grid; the plug twitches on steps() so it reads as pixel art (§7). */
  .ns-scene {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 40px;
    image-rendering: pixelated;
  }

  .ns-phone,
  .ns-pc {
    background: var(--panel-hi);
    border: 2px solid var(--line-hi);
  }

  .ns-phone { width: 40px; height: 72px; border-radius: 3px; }
  .ns-pc { width: 104px; height: 72px; border-radius: 3px; }

  .ns-cable {
    position: relative;
    width: 96px;
    height: 2px;
    background:
      repeating-linear-gradient(90deg,
        var(--line-hi) 0 8px, transparent 8px 14px);
  }

  /* The loose end. */
  .ns-plug {
    position: absolute;
    top: -5px;
    right: 0;
    width: 12px;
    height: 12px;
    background: var(--rec);
    animation: twitch 2.4s steps(3, end) infinite;
  }

  @keyframes twitch {
    0%, 70% { transform: translate(0, 0); }
    76% { transform: translate(-3px, -4px); }
    82% { transform: translate(-1px, 3px); }
    88% { transform: translate(-4px, 0); }
    94%, 100% { transform: translate(0, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ns-plug { animation: none; }
  }

  .ns-gap { width: 26px; }
</style>
</head>
